<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>GameDex | Detalle Género</title>
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/bootstrap-icons/font/bootstrap-icons.css}" rel="stylesheet">
</head>
<body>

<header th:insert="fragmentos/menu :: menu-principal"></header>

<div class="container" style="padding-top: 80px;">
    <div class="card shadow">
        <h4 class="card-header bg-success text-white">
            <i class="bi bi-tag"></i>
            Detalle del Género: <span th:text="${genero.nombre}"></span>
        </h4>
        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-3">ID:</dt>
                <dd class="col-sm-9" th:text="${genero.id}">-</dd>
                <dt class="col-sm-3">Nombre:</dt>
                <dd class="col-sm-9" th:text="${genero.nombre}">-</dd>
                <dt class="col-sm-3">Descripción:</dt>
                <dd class="col-sm-9" th:text="${genero.descripcion}">-</dd>
            </dl>

            <hr>
            <h5><i class="bi bi-joystick"></i> Videojuegos de este género
                <span class="badge badge-primary"
                      th:text="${genero.videojuegos != null ? genero.videojuegos.size() : 0}">0</span>
            </h5>

            <table class="table table-striped" th:if="${genero.videojuegos != null and !#lists.isEmpty(genero.videojuegos)}">
                <thead class="table-dark">
                    <tr>
                        <th>Título</th>
                        <th>Precio</th>
                        <th>Año</th>
                        <th>Estatus</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="juego : ${genero.videojuegos}">
                        <td th:text="${juego.titulo}">-</td>
                        <td th:text="'$' + ${juego.precio}">-</td>
                        <td th:text="${juego.anioLanzamiento}">-</td>
                        <td th:text="${juego.estatus}">-</td>
                    </tr>
                </tbody>
            </table>
            <p th:if="${genero.videojuegos == null or #lists.isEmpty(genero.videojuegos)}"
               class="text-muted">No hay videojuegos en este género aún.</p>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/generos/edit/{id}(id=${genero.id})}" class="btn btn-warning">
            <i class="bi bi-pencil"></i> Editar
        </a>
        <a th:href="@{/generos/index}" class="btn btn-secondary ml-2">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>
</div>

<footer th:insert="fragmentos/footer :: pie-pagina" class="footer mt-4"></footer>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
