<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>GameDex | Detalle Videojuego</title>
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/bootstrap-icons/font/bootstrap-icons.css}" rel="stylesheet">
</head>
<body>

<header th:insert="fragmentos/menu :: menu-principal"></header>

<div class="container" style="padding-top: 80px;">

    <div class="card shadow">
        <h4 class="card-header bg-primary text-white">
            <i class="bi bi-joystick"></i>
            Detalle: <span th:text="${videojuego.titulo}"></span>
        </h4>
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <dl class="row">
                        <dt class="col-sm-4">ID:</dt>
                        <dd class="col-sm-8" th:text="${videojuego.id}">-</dd>

                        <dt class="col-sm-4">Título:</dt>
                        <dd class="col-sm-8"><strong th:text="${videojuego.titulo}">-</strong></dd>

                        <dt class="col-sm-4">Descripción:</dt>
                        <dd class="col-sm-8" th:text="${videojuego.descripcion}">-</dd>

                        <dt class="col-sm-4">Precio:</dt>
                        <dd class="col-sm-8 text-success font-weight-bold">
                            $<span th:text="${videojuego.precio}">-</span>
                        </dd>

                        <dt class="col-sm-4">Año Lanzamiento:</dt>
                        <dd class="col-sm-8" th:text="${videojuego.anioLanzamiento}">-</dd>

                        <dt class="col-sm-4">Clasificación:</dt>
                        <dd class="col-sm-8">
                            <span class="badge badge-warning"
                                  th:text="${videojuego.clasificacion != null ? videojuego.clasificacion : '-'}"></span>
                        </dd>

                        <dt class="col-sm-4">Estatus:</dt>
                        <dd class="col-sm-8" th:text="${videojuego.estatus}">-</dd>

                        <!-- Relación @ManyToOne - Género -->
                        <dt class="col-sm-4">Género:</dt>
                        <dd class="col-sm-8">
                            <span class="badge badge-success"
                                  th:text="${videojuego.genero != null ? videojuego.genero.nombre : 'Sin género'}"></span>
                        </dd>

                        <!-- Relación @ManyToOne - Desarrollador -->
                        <dt class="col-sm-4">Desarrollador:</dt>
                        <dd class="col-sm-8"
                            th:text="${videojuego.desarrollador != null ? videojuego.desarrollador.nombre + ' (' + videojuego.desarrollador.pais + ')' : 'N/A'}">-</dd>

                        <!-- Relación @ManyToMany - Plataformas -->
                        <dt class="col-sm-4">Plataformas:</dt>
                        <dd class="col-sm-8">
                            <span th:each="plat : ${videojuego.plataformas}"
                                  class="badge badge-info mr-1"
                                  th:text="${plat.nombre}"></span>
                            <span th:if="${videojuego.plataformas == null or #lists.isEmpty(videojuego.plataformas)}"
                                  class="text-muted">Sin plataformas</span>
                        </dd>
                    </dl>
                </div>
            </div>

            <hr>
            <h6><strong>Detalles:</strong></h6>
            <p th:text="${videojuego.detalles != null ? videojuego.detalles : 'Sin detalles adicionales.'}"></p>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/videojuegos/edit/{id}(id=${videojuego.id})}" class="btn btn-warning">
            <i class="bi bi-pencil"></i> Editar
        </a>
        <a th:href="@{/videojuegos/index}" class="btn btn-secondary ml-2">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>
</div>

<footer th:insert="fragmentos/footer :: pie-pagina" class="footer mt-4"></footer>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
