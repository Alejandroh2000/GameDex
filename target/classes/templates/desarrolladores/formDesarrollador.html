<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>GameDex | Formulario Desarrollador</title>
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/bootstrap/css/sticky-footer-navbar.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">>
</head>
<body>

<header th:insert="fragmentos/menu :: menu-principal"></header>

<main role="main" style="padding-top: 80px;">
    <hr>
    <div class="container">
        <div class="card shadow">
            <h4 class="card-header bg-dark text-white">
                <i class="bi bi-person-badge"></i>
                <strong th:text="${desarrollador != null ? 'Editar Desarrollador' : 'Nuevo Desarrollador'}">Desarrollador</strong>
            </h4>
            <div class="card-body">

                <form th:action="@{/desarrolladores/save}" method="post">

                    
                    <input type="hidden" name="id"
                           th:value="${desarrollador != null ? desarrollador.id : ''}">

                    <div class="row">
                        <div class="col-md-5">
                            <div class="form-group">
                                <label for="nombre">Nombre <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nombre" name="nombre"
                                       placeholder="Nombre del estudio o desarrollador"
                                       th:value="${desarrollador != null ? desarrollador.nombre : ''}"
                                       required="required">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label for="pais">País</label>
                                <input type="text" class="form-control" id="pais" name="pais"
                                       placeholder="Ej: Japón, USA, España"
                                       th:value="${desarrollador != null ? desarrollador.pais : ''}">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-8">
                            <div class="form-group">
                                <label for="descripcion">Descripción</label>
                                <textarea class="form-control" id="descripcion" name="descripcion"
                                          rows="3" placeholder="Breve descripción del desarrollador..."
                                          th:text="${desarrollador != null ? desarrollador.descripcion : ''}"></textarea>
                            </div>
                        </div>
                    </div>

                    <hr>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Guardar
                    </button>
                    <a th:href="@{/desarrolladores/index}" class="btn btn-secondary ml-2">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>

                </form>
            </div>
        </div>
    </div>
</main>

<footer th:insert="fragmentos/footer :: pie-pagina" class="footer mt-4"></footer>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
