<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>GameDex | Catálogo de Videojuegos</title>
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/bootstrap/css/sticky-footer-navbar.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>

<header th:insert="fragmentos/menu :: menu-principal"></header>

<main role="main" style="padding-top: 70px;">

    <!-- Jumbotron / Hero -->
    <div class="jumbotron jumbotron-fluid bg-dark text-white py-5">
        <div class="container">
            <h1 class="display-4">
                <i class="bi bi-controller"></i> GameDex
            </h1>
            <p class="lead">Tu catálogo de videojuegos favoritos.</p>
            <hr class="my-4 border-light">
            <a th:href="@{/videojuegos/index}" class="btn btn-primary btn-lg mr-2">
                <i class="bi bi-joystick"></i> Ver Catálogo
            </a>
            <a th:href="@{/videojuegos/create}" class="btn btn-success btn-lg">
                <i class="bi bi-plus-circle"></i> Agregar Juego
            </a>
        </div>
    </div>

    <div class="container mt-4">

        <!-- Mensajes flash -->
        <div th:if="${msg != null}" class="alert alert-success">
            <span th:text="${msg}"></span>
        </div>

        <!-- Estadísticas rápidas -->
        <div class="row mb-4">
            <a th:href="@{/videojuegos/index}" style="text-decoration: none; color: inherit;">
            <div class="col-md-4">
                <div class="card text-white bg-primary shadow">
                    <div class="card-body text-center">
                        <h3 th:text="${videojuegos.size()}">0</h3>
                        <p class="mb-0"><i class="bi bi-joystick"></i> Videojuegos</p>
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-md-4" th:if="${generos != null}">
                <a th:href="@{/generos/index}" style="text-decoration: none; color: inherit;">
                <div class="card text-white bg-success shadow">
                    <div class="card-body text-center">
                        <h3 th:text="${generos.size()}">0</h3>
                        <p class="mb-0"><i class="bi bi-tags"></i> Géneros</p>
                        
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <a th:href="@{/desarrolladores/index}" style="text-decoration: none; color: inherit;">
                <div class="card text-white bg-dark shadow">
                    <div class="card-body text-center">
                         <h3 th:text="${totalDesarrolladores}">0</h3>
                        <p class="mb-0"><i class="bi bi-people"></i> Desarrolladores</p>
                       
        </a>
    </div>
</div>
            </div>
        </div>

        <!-- Últimos videojuegos -->
        <h4><i class="bi bi-clock-history"></i> Últimos videojuegos en el catálogo</h4>
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Título</th>
                            <th>Género</th>
                            <th>Precio</th>
                            <th>Año</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="juego : ${videojuegos}">
                            <td th:text="${juego.titulo}">-</td>
                            <td>
                                <span class="badge badge-secondary"
                                      th:text="${juego.genero != null ? juego.genero.nombre : 'Sin género'}">-</span>
                            </td>
                            <td th:text="'$' + ${juego.precio}">-</td>
                            <td th:text="${juego.anioLanzamiento}">-</td>
                            <td class="text-center">
                                <a th:href="@{/videojuegos/view/{id}(id=${juego.id})}"
                                   class="btn btn-info btn-sm">
                                    <i class="bi bi-eye"></i> Ver
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(videojuegos)}">
                            <td colspan="5" class="text-center text-muted py-3">
                                No hay videojuegos registrados.
                                <a th:href="@{/videojuegos/create}">Agrega el primero</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</main>

<footer class="footer mt-4">
    <div th:insert="fragmentos/footer :: pie-pagina"></div>
</footer>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
